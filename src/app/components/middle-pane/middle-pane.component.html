<div class="middle-pane-container flex flex-col h-[97vh] max-h-[100vh]">

  <!-- HEADER: Selected Field Group Info with editing controls -->
  <div class="header sticky top-0 bg-white z-10 p-4 border-b" *ngIf="selectedGroup">
    <form [formGroup]="form">
      <div formArrayName="fieldGroups">
        <div [formGroupName]="0">
          <div class="flex items-center justify-between">
            <ng-container *ngIf="!isEditMode; else editModeHeader">
              <h1 class="font-bold text-2xl text-gray-900">
                {{ fieldGroups.at(0).get('title')?.value }}
              </h1>
            </ng-container>
            <div class="flex items-center gap-3">
              <button *ngIf="!isEditMode" type="button" (click)="enterEditMode()"
                class="text-blue-600 hover:text-blue-800" title="Edit">
                <i class="fas fa-pencil-alt"></i>
              </button>
              <button *ngIf="isEditMode" type="button" (click)="saveHeader()"
                class="text-green-600 hover:text-green-800" title="Save">
                <i class="fas fa-check"></i>
              </button>
              <button *ngIf="isEditMode" type="button" (click)="cancelEdit()"
                class="text-yellow-500 hover:text-yellow-700" title="Cancel">
                <i class="fas fa-times"></i>
              </button>
              <button type="button" (click)="copyGroup()" class="text-indigo-500 hover:text-indigo-700" title="Copy">
                <i class="fas fa-copy"></i>
              </button>
              <button type="button" (click)="deleteGroup()" class="text-red-500 hover:text-red-700" title="Delete">
                <i class="fas fa-trash-alt"></i>
              </button>
            </div>
          </div>
          <ng-container *ngIf="!isEditMode; else editModeDescription">
            <p class="text-sm text-gray-500 mt-1">
              {{ fieldGroups.at(0).get('description')?.value || 'Add description...' }}
            </p>
          </ng-container>
          <ng-template #editModeHeader>
            <div class="flex items-center gap-3">
              <input type="text" formControlName="title"
                class="border border-gray-300 px-3 py-2 rounded text-base focus:outline-none focus:ring-2 focus:ring-blue-300 w-full"
                placeholder="Enter title" />
            </div>
          </ng-template>
          <ng-template #editModeDescription>
            <textarea formControlName="description" rows="2"
              class="border border-gray-300 mt-2 px-3 py-2 rounded text-base focus:outline-none focus:ring-2 focus:ring-blue-300 w-full resize-none"
              placeholder="Add description..."></textarea>
          </ng-template>
        </div>
      </div>
    </form>
  </div>

  <!-- DROP ZONE -->
  <div class="drop-zone flex-1 p-4 relative overflow-y-auto" (dragover)="onDragOver($event)"
    (drop)="onDropNative($event)" style="min-height:200px;">
    <!-- Animated Loader with Text -->
    <div *ngIf="isLoading"
      class="absolute inset-0 flex flex-col items-center justify-center bg-white bg-opacity-75 z-10">
      <div class="loader h-6 w-6 border-4 border-blue-600 rounded-full border-t-transparent animate-spin"></div>
      <div class="loader-text mt-2 text-blue-600 text-sm animate-pulse">Field is rendering...</div>
    </div>
    <!-- Rendered Form Fields -->
    <ng-container *ngFor="let field of renderedFields; trackBy: trackByFn">
      <app-form-renderer [field]="field" (editField)="editField($event)" (copyField)="copyField($event)"
        (deleteField)="deleteField($event)" class="mt-2">
      </app-form-renderer>
    </ng-container>
  </div>

  <!-- FOOTER -->
  <div class="footer sticky bottom-0 bg-white p-4 border-t flex justify-between items-center">
    <!-- Left: Small Save & Preview Buttons -->
    <div class="flex space-x-2">
      <button type="button" (click)="saveForm()"
        class="bg-blue-600 text-white text-xs px-2 py-1 rounded hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="isSaveDisabled">
        Save
      </button>
      <button type="button" (click)="previewForm()"
        class="bg-purple-600 text-white text-xs px-2 py-1 rounded hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="isSaveDisabled"
        [title]="'After form is saved only you can preview the form'">
        Preview
      </button>
    </div>
    <!-- Right: Export & Import Icons -->
    <div class="flex space-x-3">
      <button type="button" (click)="exportForm()"
        class="text-blue-600 hover:text-blue-800 text-lg disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="isSaveDisabled" title="Export">
        <i class="fas fa-download"></i>
      </button>
      <label class="cursor-pointer text-green-600 hover:text-green-800 text-lg"
        title="Import">
        <i class="fas fa-upload"></i>
        <input type="file" (change)="importForm($event)" accept=".json" hidden>
      </label>
    </div>
  </div>

  <!-- RIGHT DRAWER: Edit Field Form -->
  <app-right-drawer
    *ngIf="isRightDrawerOpen"
    [fieldData]="selectedRenderedField"
    (closeDrawer)="onCloseDrawer()"
    (saveField)="onFieldUpdated($event)">
  </app-right-drawer>

  <!-- FORM PREVIEW -->
  <app-form-preview
  *ngIf="isPreviewOpen"
  [headerData]="savedFormData?.fieldGroups[0]"
  [fields]="savedFormData?.formFields"
  (closePreview)="isPreviewOpen = false">
</app-form-preview>

</div>
