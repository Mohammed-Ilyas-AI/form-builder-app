<!-- Right Drawer Container -->
<div
  class="right-drawer fixed inset-y-0 right-0 w-96 h-[97vh] bg-white shadow-xl z-50 transform transition-transform duration-300"
  [class.open]="drawerOpen" [class.closed]="!drawerOpen">

  <!-- Drawer Header -->
  <div class="flex justify-between items-center p-6 border-b border-gray-200 bg-gray-50">
    <h2 class="text-2xl font-semibold text-gray-800">Edit Field</h2>
    <button (click)="close()" class="text-gray-600 hover:text-gray-800 focus:outline-none">
      <i class="fas fa-times fa-lg"></i>
    </button>
  </div>

  <!-- Drawer Content -->
  <div class="p-6 overflow-y-auto space-y-4 h-full">
    <form [formGroup]="editForm">

      <!-- Field Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Field Name</label>
        <input
          type="text"
          formControlName="fieldName"
          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter field name" />
      </div>

      <!-- Description -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea
          formControlName="description"
          rows="2"
          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter description (optional)"></textarea>
      </div>

      <!-- Placeholder -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Placeholder</label>
        <input
          type="text"
          formControlName="placeholder"
          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter placeholder text" />
      </div>

      <!-- Required Field -->
      <div class="flex items-center mt-4 mb-4">
        <input
          type="checkbox"
          formControlName="required"
          id="requiredCheckbox"
          class="h-4 w-4 text-blue-600 border-gray-300 rounded" />
        <label for="requiredCheckbox" class="ml-2 text-sm text-gray-700">
          Required Field
        </label>
      </div>

      <!-- Additional Properties Section -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Additional Properties</label>
        <div formArrayName="additionalProperties" class="space-y-2">
          <div *ngFor="let prop of additionalProperties.controls; let i = index"
               [formGroupName]="i" class="flex gap-2 items-center">
            <!-- Dropdown for property key using generalOptions -->
            <select formControlName="key"
                    class="w-1/2 border border-gray-300 rounded-md shadow-sm py-2 px-2 focus:ring-blue-500 focus:border-blue-500">
              <option value="" disabled>Select Property</option>
              <option *ngFor="let option of generalOptions" [value]="option.id">
                {{ option.name }}
              </option>
            </select>
            <input type="text" formControlName="value"
                   placeholder="Property Value"
                   class="w-1/2 border border-gray-300 rounded-md shadow-sm py-2 px-2 focus:ring-blue-500 focus:border-blue-500" />
            <button type="button" (click)="removeProperty(i)" class="text-red-600 hover:text-red-800 focus:outline-none">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
        <button type="button" (click)="addProperty()"
                class="mt-2 text-sm text-blue-600 hover:text-blue-800 focus:outline-none">
          <i class="fas fa-plus"></i> Add Property
        </button>
      </div>

      <!-- Validations Section -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Validations</label>
        <div formArrayName="validations" class="space-y-2">
          <div *ngFor="let valid of validations.controls; let i = index"
               [formGroupName]="i" class="flex gap-2 items-center">
            <!-- Dropdown for validation name using validationOptions -->
            <select formControlName="name"
                    class="w-1/2 border border-gray-300 rounded-md shadow-sm py-2 px-2 focus:ring-blue-500 focus:border-blue-500">
              <option value="" disabled>Select Validation</option>
              <option *ngFor="let option of validationOptions" [value]="option.id">
                {{ option.name }}
              </option>
            </select>
            <input type="text" formControlName="value"
                   placeholder="Validation Value"
                   class="w-1/2 border border-gray-300 rounded-md shadow-sm py-2 px-2 focus:ring-blue-500 focus:border-blue-500" />
            <button type="button" (click)="removeValidation(i)" class="text-red-600 hover:text-red-800 focus:outline-none">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
        <button type="button" (click)="addValidation()"
                class="mt-2 text-sm text-blue-600 hover:text-blue-800 focus:outline-none">
          <i class="fas fa-plus"></i> Add Validation
        </button>
      </div>

      <!-- Save Button -->
      <div class="flex justify-end mt-4">
        <button type="button" (click)="onSave()"
                class="bg-blue-600 text-white py-2 px-6 rounded-md shadow hover:bg-blue-700 focus:outline-none">
          Save Changes
        </button>
      </div>

    </form>
  </div>
</div>
