<div class="bg-white border border-gray-300 p-4 rounded-lg shadow relative mb-4">
  <!-- Action Buttons -->
  <div class="absolute top-2 right-2 flex gap-2">
    <button type="button" (click)="onEdit()" title="Edit" class="text-gray-600 hover:text-blue-600">
      <i class="fas fa-pencil-alt"></i>
    </button>
    <button type="button" (click)="onCopy()" title="Copy" class="text-gray-600 hover:text-blue-600">
      <i class="fas fa-copy"></i>
    </button>
    <button type="button" (click)="onDelete()" title="Delete" class="text-gray-600 hover:text-red-600">
      <i class="fas fa-trash-alt"></i>
    </button>
  </div>

  <!-- Field Display -->
  <div class="mt-4">
    <label class="block font-medium text-gray-700 mb-2">{{ field.label }}</label>
    <ng-container [ngSwitch]="field.type">
      <!-- 1. Input field (text) -->
      <input *ngSwitchCase="'text'"
             type="text"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-300"
             placeholder="Enter text" />

      <!-- 2. Textarea -->
      <textarea *ngSwitchCase="'textarea'"
                rows="3"
                class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-300"
                placeholder="Enter text">
      </textarea>

      <!-- 3. Number field -->
      <input *ngSwitchCase="'number'"
             type="number"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-300"
             placeholder="Enter number" />

      <!-- 4. Radio field -->
      <div *ngSwitchCase="'radio'" class="space-y-2">
        <div *ngFor="let option of field.options" class="flex items-center">
          <input type="radio"
                 [name]="field.id"
                 [value]="option"
                 class="mr-2" />
          <span>{{ option }}</span>
        </div>
      </div>

      <!-- 5. Checkbox field -->
      <div *ngSwitchCase="'checkbox'" class="space-y-2">
        <div *ngFor="let option of field.options" class="flex items-center">
          <input type="checkbox"
                 [value]="option"
                 class="mr-2" />
          <span>{{ option }}</span>
        </div>
      </div>

      <!-- 6. Dropdown -->
      <select *ngSwitchCase="'dropdown'"
              class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-300">
        <option *ngFor="let option of field.options" [value]="option">{{ option }}</option>
      </select>

      <!-- 7. Date picker -->
      <input *ngSwitchCase="'date'"
             type="date"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-300" />

      <!-- 8. Time picker -->
      <input *ngSwitchCase="'time'"
             type="time"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-300" />

      <!-- 9. Date and time picker -->
      <input *ngSwitchCase="'datetime'"
             type="datetime-local"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-300" />

      <!-- 10. File upload -->
      <input *ngSwitchCase="'file'"
             type="file"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-300" />

      <!-- Default fallback -->
      <input *ngSwitchDefault
             type="text"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-300"
             placeholder="Enter value" />
    </ng-container>
  </div>
</div>
