<!-- Preview Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-800 bg-opacity-50">
  <!-- Modal Container -->
  <div class="bg-white rounded-lg shadow-lg w-full max-w-3xl lg:max-w-4xl p-6">
    <!-- Modal Header -->
    <div class="flex justify-between items-center border-b border-gray-300 pb-4">
      <h2 class="text-xl font-semibold text-gray-800">
        {{ headerData.title || 'Form Preview' }}
      </h2>
      <button class="close-button text-gray-600 hover:text-gray-800 focus:outline-none" (click)="onClose()">
        <i class="fas fa-times text-lg"></i>
      </button>
    </div>
    <!-- Modal Body -->
    <div class="mt-6">
      <!-- Header Description -->
      <p *ngIf="headerData?.description" class="text-sm text-gray-600 mb-6">
        {{ headerData.description }}
      </p>
      <!-- Rendered Form Fields -->
      <form class="space-y-4">
        <ng-container *ngFor="let field of fields">
          <div class="flex flex-col">
            <label class="text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
            <ng-container [ngSwitch]="field.type">
              <!-- Text Field -->
              <input *ngSwitchCase="'text'" type="text" [value]="field.value || field.placeholder || 'N/A'"
                     readonly class="border border-gray-300 bg-gray-100 px-3 py-1 rounded text-sm text-gray-700 focus:outline-none cursor-not-allowed">

              <!-- Textarea -->
              <textarea *ngSwitchCase="'textarea'" rows="3" [value]="field.value || field.placeholder || 'N/A'"
                        readonly class="border border-gray-300 bg-gray-100 px-3 py-1 rounded text-sm text-gray-700 focus:outline-none cursor-not-allowed resize-none"></textarea>

              <!-- Number Field -->
              <input *ngSwitchCase="'number'" type="number" [value]="field.value || field.placeholder || 'N/A'"
                     readonly class="border border-gray-300 bg-gray-100 px-3 py-1 rounded text-sm text-gray-700 focus:outline-none cursor-not-allowed">

              <!-- Date Field -->
              <input *ngSwitchCase="'date'" type="date" [value]="field.value || field.placeholder || 'N/A'"
                     readonly class="border border-gray-300 bg-gray-100 px-3 py-1 rounded text-sm text-gray-700 focus:outline-none cursor-not-allowed">

              <!-- Time Field -->
              <input *ngSwitchCase="'time'" type="time" [value]="field.value || field.placeholder || 'N/A'"
                     readonly class="border border-gray-300 bg-gray-100 px-3 py-1 rounded text-sm text-gray-700 focus:outline-none cursor-not-allowed">

              <!-- Date & Time Field -->
              <input *ngSwitchCase="'datetime-local'" type="datetime-local" [value]="field.value || field.placeholder || 'N/A'"
                     readonly class="border border-gray-300 bg-gray-100 px-3 py-1 rounded text-sm text-gray-700 focus:outline-none cursor-not-allowed">

              <!-- Radio Buttons -->
              <div *ngSwitchCase="'radio'" class="space-y-1">
                <div *ngFor="let option of field.options" class="flex items-center">
                  <input type="radio" [checked]="option === field.value" disabled
                         class="cursor-not-allowed text-blue-600 focus:outline-none">
                  <label class="ml-2 text-sm text-gray-700">{{ option }}</label>
                </div>
              </div>

              <!-- Checkboxes -->
              <div *ngSwitchCase="'checkbox'" class="space-y-1">
                <div *ngFor="let option of field.options" class="flex items-center">
                  <input type="checkbox" [checked]="field.value?.includes(option)" disabled
                         class="cursor-not-allowed text-blue-600 focus:outline-none">
                  <label class="ml-2 text-sm text-gray-700">{{ option }}</label>
                </div>
              </div>

              <!-- Dropdown -->
              <select *ngSwitchCase="'select'" readonly
                      class="border border-gray-300 bg-gray-100 px-3 py-1 rounded text-sm text-gray-700 focus:outline-none cursor-not-allowed">
                <option *ngFor="let option of field.options" [value]="option" [selected]="option === field.value">
                  {{ option }}
                </option>
              </select>

              <!-- File Upload -->
              <input *ngSwitchCase="'file'" type="file" readonly
                     class="border border-gray-300 bg-gray-100 px-3 py-1 rounded text-sm text-gray-700 focus:outline-none cursor-not-allowed">

              <!-- Default Fallback -->
              <input *ngSwitchDefault type="text" [value]="field.value || field.placeholder || 'N/A'"
                     readonly class="border border-gray-300 bg-gray-100 px-3 py-1 rounded text-sm text-gray-700 focus:outline-none cursor-not-allowed">
            </ng-container>
          </div>
        </ng-container>
      </form>
    </div>
  </div>
</div>
